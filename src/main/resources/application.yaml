spring:
  application:
    name: ticketing
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 500
        order_inserts: true
    open-in-view: false
  data:
    redis:
      timeout: 3s
    web:
      pageable:
        max-page-size: 50
server:
  port: 8085
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token-validity: 7d